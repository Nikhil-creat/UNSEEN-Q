apiVersion: v1
kind: Namespace
metadata: { name: unseen }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: unseen }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: agents, namespace: unseen }
spec:
  replicas: 3
  selector: { matchLabels: { app: agents } }
  template:
    metadata: { labels: { app: agents } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
      - name: agents
        image: ghcr.io/nikhil-creat/unseen-agents:latest
        ports: [{ containerPort: 8000 }]
        readinessProbe: { httpGet: { path: /health, port: 8000 } }
        securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
        resources: { limits: { cpu: "500m", memory: 512Mi } }
